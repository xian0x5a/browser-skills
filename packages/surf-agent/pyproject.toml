[project]
name = "surf-agent"
version = "0.1.0"
description = "Agent-scoped wrapper for generic surf browser control"
requires-python = ">=3.11"
dependencies = [
    "patchright>=1.64.1,<2",
    "platformdirs",
    "psutil>=7.2.2",
    "starlette>=1.10.0",
    "tldextract>=5.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
